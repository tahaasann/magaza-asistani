[project]
name = "magaza-asistani"
version = "0.1.0"
description = "Multi-agent assistant for retail store teams (portfolio project, synthetic data only)."
authors = [
    { name = "tahaasann", email = "tahaasann@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
